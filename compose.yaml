services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: stormhacks
      POSTGRES_PASSWORD: stormhacks
      POSTGRES_DB: stormhacks
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stormhacks -d stormhacks"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
